[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "prpl_dexmate"
version = "0.1.0"
description = "PRPL code for the Dexmate robot."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
   "dexcontrol",
   "dexmate-urdf",
   "gymnasium",
   "hydra-core",
   # b762a19 = top-down grasp constraint with posture-preserving sampling
   # (kinder-baselines#135).
   "kinder_bilevel_planning @ git+https://github.com/Princeton-Robot-Planning-and-Learning/kinder-baselines.git@b762a19#subdirectory=kinder-bilevel-planning",
   "kinder_models @ git+https://github.com/Princeton-Robot-Planning-and-Learning/kinder-baselines.git@b762a19#subdirectory=kinder-models",
   "kindergarden[prpl-kinematics]>=0.2.3",
   # Without ompl the skills silently fall back to BiRRT motion planning;
   # OMPL's RRTConnect + simplification gives near-straight joint paths.
   "ompl",
   # Floor for the symmetric Vega home (prpl-mono#530) and the Dexgripper S
   # model sync (prpl-mono#533); kindergarden's extra alone guarantees neither.
   "prpl_kinematics>=0.0.3",
   "numpy",
   "opencv-python",
   "prpl_utils>=0.0.7",
   "relational_structs>=0.0.1",
]

[project.optional-dependencies]
develop = [
    "black",
    "docformatter",
    "isort",
    "mypy",
    "pylint>=2.14.5",
    "pytest-pylint>=0.18.0",
    "pytest>=7.2.2,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prpl_dexmate = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
py_version = 310
profile = "black"
multi_line_output = 2
skip_glob = ["venv/*", ".venv/*"]
split_on_trailing_comma = true

[tool.docformatter]
line-length = 88
wrap-summaries = 88
wrap-descriptions = 88

[tool.mypy]
strict_equality = true
disallow_untyped_calls = true
warn_unreachable = true
exclude = ["venv/*", ".venv/*"]

[[tool.mypy.overrides]]
module = [
    "bilevel_planning.*",
    "cv2.*",
    "dexcontrol.*",
    "dexmate_urdf.*",
    "kinder.*",
    "kinder_bilevel_planning.*",
    "kinder_models.*",
    "prpl_utils.*",
    "relational_structs.*",
]
ignore_missing_imports = true
