[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "prpl_dexmate"
version = "0.1.0"
description = "PRPL code for the Dexmate robot."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
   "dexcontrol",
   "dexmate-urdf",
   "gymnasium",
   "hydra-core",
   "kindergarden[prpl-kinematics] @ git+https://github.com/Princeton-Robot-Planning-and-Learning/kindergarden.git@c9b747c",
   "numpy",
   "opencv-python",
   "prpl_utils>=0.0.7",
   "relational_structs>=0.0.1",
]

[project.optional-dependencies]
develop = [
    "black",
    "docformatter",
    "isort",
    "mypy",
    "pylint>=2.14.5",
    "pytest-pylint>=0.18.0",
    "pytest>=7.2.2,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prpl_dexmate = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
py_version = 310
profile = "black"
multi_line_output = 2
skip_glob = ["venv/*", ".venv/*"]
split_on_trailing_comma = true

[tool.docformatter]
line-length = 88
wrap-summaries = 88
wrap-descriptions = 88

[tool.mypy]
strict_equality = true
disallow_untyped_calls = true
warn_unreachable = true
exclude = ["venv/*", ".venv/*"]

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "dexcontrol.*",
    "dexmate_urdf.*",
    "kinder.*",
    "prpl_utils.*",
    "relational_structs.*",
]
ignore_missing_imports = true
