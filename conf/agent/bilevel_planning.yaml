# Bilevel planning agent over the kinder-baselines VegaMotion3D env
# models: samples a reachable end-effector pose at the target, solves IK,
# motion-plans a collision-free joint path, and emits bounded joint
# deltas.
_target_: kinder_bilevel_planning.agent.BilevelPlanningAgent
max_abstract_plans: 10
samples_per_step: 3
max_skill_horizon: 100
heuristic_name: hff
planning_timeout: 60.0
env_models:
  _target_: prpl_dexmate.real_sim.build_planner_env_models
  env_name: ${env.env_name}
  env_id: ${env.env_id}
