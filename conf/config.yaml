# Top-level pipeline config. Pick an env via Hydra group:
#   python scripts/run_pipeline.py env=vega_motion3d mode=sim
#
# `mode` is a plain string field rather than its own group — each env
# yaml exposes `pipelines.{fake,sim,real}` and the pipeline selects the
# right one with `cfg.env.pipelines[cfg.mode]`. Adding a new env is one
# new file under conf/env/; no code changes.

defaults:
  - _self_
  - env: ???
  - agent: bilevel_planning

hydra:
  run:
    dir: ./logs/${now:%Y-%m-%d}/${now:%H-%M-%S}

mode: fake
seed: 0
max_eval_steps: 100

# Video recording. When `record.video` is true and a log dir is available
# (the Hydra runtime dir, or an explicit `log_dir` argument to
# run_pipeline), every tick's rendered frame is composed into video.mp4.
# Only envs whose render() returns frames produce video — sim does; the
# real env has no renderer yet.
record:
  video: false
  fps: 10

# The planning agent is a Hydra group: `agent=bilevel_planning` (default)
# or `agent=scripted` (dependency-light, deterministic). See conf/agent/.
